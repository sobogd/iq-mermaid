# Reference nginx server blocks for iq-mermaid.com (prod:
# /etc/nginx/sites-available/iq-mermaid.conf, symlinked into sites-enabled).
# Reload with: nginx -t && systemctl reload nginx
# Cert: certbot certonly --webroot -w /var/www/letsencrypt -d iq-mermaid.com -d www.iq-mermaid.com

server {
    # nginx 1.18: the http2 flag is per listening socket, so :443 is already
    # h2 from another vhost on this shared box. Stated explicitly so it
    # survives that vhost being cleaned up.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iq-mermaid.com;

    ssl_certificate /etc/letsencrypt/live/iq-mermaid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iq-mermaid.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers. Shared server — this block only covers iq-mermaid.com,
    # other vhosts are untouched.
    # HSTS: the apex + www already redirect every plain-HTTP hit to TLS, this
    # stops the first redirect from happening at all on repeat visits.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # No Content-Security-Policy yet: mermaid renders diagrams by injecting
    # SVG it generates at runtime, and a wrong policy breaks the editor
    # silently. Needs its own pass.

    # Brotli is enabled server-wide in /etc/nginx/conf.d/brotli.conf, loaded by
    # /etc/nginx/modules-enabled/50-mod-http-brotli.conf. Ubuntu ships no arm64
    # brotli module for nginx 1.18, so the two .so files were built from source
    # on the box (/usr/local/src/brotli-build). They must be rebuilt if nginx
    # ever moves off 1.18.x, otherwise nginx refuses to start.

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Next.js running under PM2 on port 8204
    location / {
        proxy_pass http://127.0.0.1:8204;
        # Ask Next for uncompressed output so nginx can apply brotli here;
        # otherwise Next gzips first and the response can no longer be
        # recompressed.
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Region of the visitor, from the ngx_http_geoip2 module declared
        # http-wide in /etc/nginx/nginx.conf against
        # /usr/share/GeoIP/GeoLite2-City.mmdb. Nothing reads these today —
        # language routing is done from Accept-Language in proxy.ts, which is
        # the better signal — but they are forwarded so that a future
        # region-aware feature does not need an infra change. The header NAMES
        # are Cloudflare's, matching the other apps on this box.
        # proxy_set_header overwrites whatever the client sent, so these
        # cannot be spoofed.
        proxy_set_header cf-ipcountry $geoip2_country_code;
        proxy_set_header cf-ipcity $geoip2_city_name;
        proxy_set_header cf-region $geoip2_region_name;
        proxy_set_header cf-region-code $geoip2_region_code;
        proxy_cache_bypass $http_upgrade;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.iq-mermaid.com;

    ssl_certificate /etc/letsencrypt/live/iq-mermaid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iq-mermaid.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-mermaid.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name iq-mermaid.com www.iq-mermaid.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://iq-mermaid.com$request_uri; }
}
